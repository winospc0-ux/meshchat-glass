name: Android

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream binary assets
        run: |
          curl -L -o /tmp/upstream.tar.gz https://github.com/permissionlesstech/bitchat-android/archive/97db392d2a885deec3beac5b2214c9d350bb232c.tar.gz
          mkdir -p /tmp/upstream && tar -xzf /tmp/upstream.tar.gz -C /tmp/upstream --strip-components=1
          cp /tmp/upstream/gradle/wrapper/gradle-wrapper.jar gradle/wrapper/
          mkdir -p app/src/main/jniLibs
          cp -r /tmp/upstream/app/src/main/jniLibs/. app/src/main/jniLibs/
          for d in /tmp/upstream/app/src/main/res/mipmap-*; do cp -r "$d" app/src/main/res/; done
          cp -r /tmp/upstream/app/src/main/res/font app/src/main/res/

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
